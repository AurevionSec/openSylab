# OpenSylab TLS/HTTPS Configuration
# Version 0.5.0

# TLS Enable/Disable
# Set to 'true' to enable HTTPS, 'false' for HTTP only
tls_enabled=true

# Certificate Path
# Path to PEM-encoded X.509 certificate file
# For production: Use a certificate from a trusted CA
# For development: Use self-signed certificate (see scripts/generate_cert.sh)
certificate=/etc/opensylab/certs/cert.pem

# Private Key Path
# Path to PEM-encoded private key file
# IMPORTANT: Keep this file secure with restricted permissions (chmod 600)
private_key=/etc/opensylab/certs/key.pem

# Development/Testing Configuration
# For local development, you can use relative paths:
# certificate=./certs/cert.pem
# private_key=./certs/key.pem

# Production Best Practices:
# 1. Use certificates from a trusted CA (Let's Encrypt, DigiCert, etc.)
# 2. Keep private keys secure with file permissions 600
# 3. Never commit private keys to version control
# 4. Use environment variables for sensitive paths in CI/CD
# 5. Rotate certificates before expiration
# 6. Monitor certificate expiration dates

# TLS Protocol Configuration
# Minimum TLS version is hardcoded to TLS 1.2 for security
# Supported cipher suites use strong encryption (AES-GCM, ChaCha20-Poly1305)

# Port Configuration
# HTTPS typically uses port 8443 (non-privileged) or 443 (privileged)
# HTTP uses port 8080 (non-privileged) or 80 (privileged)
# Configure port via command-line argument: --port 8443

# Example Usage:
# ./OpenSylab --api --port 8443 --tls-cert ./certs/cert.pem --tls-key ./certs/key.pem
