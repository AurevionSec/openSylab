# OpenSylab Datenbank-Konfiguration
# Version 0.1.1

# Datenbankpfad (SQLite)
# Standard: opensylab.db im aktuellen Verzeichnis
# Kann auch als absoluter Pfad angegeben werden
database_path=opensylab.db

# Datenbank-Typ (für zukünftige Versionen)
# Aktuell nur SQLite unterstützt
# Geplant: postgresql, mysql
database_type=sqlite

# Backup-Einstellungen (für zukünftige Versionen)
auto_backup=false
backup_interval_hours=24
backup_directory=./backups

# Logging (für zukünftige Versionen)
log_level=INFO
log_file=opensylab.log

# Hinweis: Diese Konfigurationsdatei ist für v0.1 noch nicht funktional.
# Sie dient als Vorlage für zukünftige Entwicklungen.
# Aktuell wird die Datenbank über Kommandozeilenargument oder
# Umgebungsvariable OPENSYLAB_DB_PATH konfiguriert.
