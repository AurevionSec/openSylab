<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSylab - Auto Login Test</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #1A1C20;
            color: #fff;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        .status {
            background: #15171a;
            border: 1px solid #2563EB;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .success { border-color: #10B981; }
        .error { border-color: #FF3B30; }
        button {
            background: #2563EB;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #1D4ED8;
        }
        pre {
            background: #000;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        h1 { color: #2563EB; }
    </style>
</head>
<body>
    <h1>OpenSylab v0.6 - Authentication Test</h1>

    <div id="status" class="status">
        <h2>Status: Ready</h2>
        <p>Click the button below to test authentication and auto-login.</p>
    </div>

    <button onclick="testLogin()">Test Login</button>
    <button onclick="fetchSamples()">Fetch Samples (after login)</button>
    <button onclick="goToDashboard()">Go to Dashboard</button>

    <div id="output"></div>

    <script>
        const API_URL = 'http://localhost:8080/api/v1';

        function updateStatus(title, message, type = 'status') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = `<h2>${title}</h2><p>${message}</p>`;
        }

        function addOutput(content) {
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML += `<pre>${JSON.stringify(content, null, 2)}</pre>`;
        }

        async function testLogin() {
            try {
                updateStatus('Logging in...', 'Attempting to authenticate with admin credentials');

                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin'
                    })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // Store token in localStorage
                    localStorage.setItem('opensylab_jwt_token', data.token);
                    localStorage.setItem('opensylab_user_info', JSON.stringify(data.user));

                    const expirationTime = Date.now() + data.expiresIn * 1000;
                    localStorage.setItem('opensylab_token_expiry', expirationTime.toString());

                    updateStatus('Login Successful!', `Logged in as ${data.user.username} (${data.user.role}). Token stored in localStorage.`, 'success');
                    addOutput({ login_response: data });
                } else {
                    updateStatus('Login Failed', `Error: ${data.error?.message || 'Unknown error'}`, 'error');
                    addOutput({ error: data });
                }
            } catch (error) {
                updateStatus('Login Error', `Network error: ${error.message}`, 'error');
                addOutput({ error: error.message });
            }
        }

        async function fetchSamples() {
            try {
                const token = localStorage.getItem('opensylab_jwt_token');

                if (!token) {
                    updateStatus('No Token', 'Please login first!', 'error');
                    return;
                }

                updateStatus('Fetching samples...', 'Requesting data from API');

                const response = await fetch(`${API_URL}/samples?limit=5`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    updateStatus('Samples Loaded!', `Successfully fetched ${data.data?.length || 0} samples`, 'success');
                    addOutput({ samples: data.data?.slice(0, 3) });
                } else {
                    updateStatus('API Error', `Error: ${data.error?.message || 'Unknown error'}`, 'error');
                    addOutput({ error: data });
                }
            } catch (error) {
                updateStatus('Fetch Error', `Network error: ${error.message}`, 'error');
                addOutput({ error: error.message });
            }
        }

        function goToDashboard() {
            window.location.href = '/';
        }

        // Auto-login on page load
        window.addEventListener('load', () => {
            const token = localStorage.getItem('opensylab_jwt_token');
            if (token) {
                updateStatus('Already Logged In', 'Token found in localStorage. You can fetch samples or go to dashboard.', 'success');
            }
        });
    </script>
</body>
</html>
