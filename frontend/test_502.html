<!DOCTYPE html>
<html>
<head>
    <title>502 Debug Test</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
        }
        .log {
            background: #111;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #0f0;
        }
        .error { border-left-color: #f00; color: #f00; }
        button {
            background: #2563EB;
            color: white;
            padding: 15px 30px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>502 Error Debug - Direct API Test</h1>
    <button onclick="testDirectAPI()">Test Direct API Call</button>
    <button onclick="testWithFetch()">Test with Fetch</button>
    <button onclick="testWithAxios()">Test with Axios</button>
    <div id="output"></div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'log error' : 'log';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.getElementById('output').appendChild(div);
            console.log(msg);
        }

        async function testDirectAPI() {
            log('=== Testing Direct API Call ===');
            try {
                const response = await fetch('http://localhost:8080/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin'
                    })
                });

                log(`Response status: ${response.status}`);
                log(`Response statusText: ${response.statusText}`);
                log(`Response ok: ${response.ok}`);
                log(`Response type: ${response.type}`);

                const data = await response.json();
                log(`Response data: ${JSON.stringify(data)}`);

                if (data.token) {
                    log(`✓ SUCCESS! Token received: ${data.token.substring(0, 50)}...`);

                    // Try to fetch samples
                    log('\nNow testing /samples endpoint...');
                    const samplesRes = await fetch('http://localhost:8080/api/v1/samples?limit=5', {
                        headers: {
                            'Authorization': `Bearer ${data.token}`
                        }
                    });
                    log(`Samples status: ${samplesRes.status}`);
                    const samplesData = await samplesRes.json();
                    log(`Samples count: ${samplesData.data?.length || 0}`);
                } else {
                    log('✗ No token in response!', true);
                }
            } catch (error) {
                log(`✗ ERROR: ${error.message}`, true);
                log(`Error type: ${error.constructor.name}`, true);
                log(`Error stack: ${error.stack}`, true);
            }
        }

        async function testWithFetch() {
            log('=== Testing with Fetch (Same as React would use) ===');
            try {
                const API_URL = 'http://localhost:8080/api/v1';

                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin'
                    })
                });

                log(`Status: ${response.status} ${response.statusText}`);

                if (!response.ok) {
                    log(`✗ Response not OK! Status: ${response.status}`, true);
                }

                const text = await response.text();
                log(`Raw response: ${text.substring(0, 200)}`);

                const data = JSON.parse(text);
                log(`Parsed data has token: ${!!data.token}`);

            } catch (error) {
                log(`✗ FETCH ERROR: ${error.message}`, true);
                log(`Full error: ${JSON.stringify(error, Object.getOwnPropertyNames(error))}`, true);
            }
        }

        async function testWithAxios() {
            log('=== Testing with Axios (Same library as React app) ===');
            try {
                const response = await axios.post('http://localhost:8080/api/v1/auth/login', {
                    username: 'admin',
                    password: 'admin'
                }, {
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                log(`Axios status: ${response.status}`);
                log(`Axios data: ${JSON.stringify(response.data)}`);

                if (response.data.token) {
                    log(`✓ Axios SUCCESS! Token: ${response.data.token.substring(0, 50)}...`);
                }
            } catch (error) {
                log(`✗ AXIOS ERROR: ${error.message}`, true);
                if (error.response) {
                    log(`Response status: ${error.response.status}`, true);
                    log(`Response data: ${JSON.stringify(error.response.data)}`, true);
                } else if (error.request) {
                    log(`No response received. Request was made but no response.`, true);
                    log(`Error request: ${error.request}`, true);
                } else {
                    log(`Error setting up request: ${error.message}`, true);
                }
            }
        }

        // Auto-run first test
        window.addEventListener('load', () => {
            setTimeout(testDirectAPI, 500);
        });
    </script>
</body>
</html>
