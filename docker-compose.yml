services:
  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensylab-backend
    restart: unless-stopped
    ports:
      - "9080:8080"
    volumes:
      # Persist SQLite database
      - opensylab-data:/app/data
      # Optional: Mount TLS certificates
      - ./certs:/app/certs:ro
    environment:
      - OPENSYLAB_DB_PATH=/app/data/opensylab.db
      # SECURITY: both secrets come from an untracked .env file (see .env.example).
      # Never commit real secrets. Generate with: openssl rand -hex 32
      - OPENSYLAB_JWT_SECRET=${OPENSYLAB_JWT_SECRET:?set OPENSYLAB_JWT_SECRET in .env (min 32 chars)}
      - OPENSYLAB_AUDIT_HMAC_KEY=${OPENSYLAB_AUDIT_HMAC_KEY:?set OPENSYLAB_AUDIT_HMAC_KEY in .env (min 32 chars)}
      # Optional: Enable TLS
      # - OPENSYLAB_TLS_CERT=/app/certs/server.crt
      # - OPENSYLAB_TLS_KEY=/app/certs/server.key
    networks:
      - opensylab-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend Web UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opensylab-frontend
    restart: unless-stopped
    ports:
      - "9090:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - opensylab-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  # Named volume for persistent SQLite database
  opensylab-data:
    driver: local

networks:
  # Internal network for backend-frontend communication
  opensylab-network:
    driver: bridge
